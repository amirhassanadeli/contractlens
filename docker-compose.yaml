services:
  db:
    image: postgres:17
    container_name: contractlens-db
    restart: always
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  django-web:
    build: .
    container_name: contractlens-django-docker
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./static:/app/staticfiles
      - ./mediafiles:/app/mediafiles
    env_file:
      - .env.prod
    expose:
      - "8000"

  frontend-proxy:
    image: nginx:latest
    container_name: contractlens-nginx
    ports:
      - "8001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/staticfiles:ro
      - ./mediafiles:/app/mediafiles:ro
    depends_on:
      - django-web
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: contractlens-ollama
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data: