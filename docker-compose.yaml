services:
  db:
    image: postgres:17
    container_name: contractlens-db
    restart: always
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  django-web:
    build: .
    container_name: contractlens-django-docker
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./static:/app/staticfiles
      - ./mediafiles:/app/mediafiles
    env_file:
      - .env.prod
    expose:
      - "8000"

  frontend-proxy:
    image: nginx:latest
    container_name: contractlens-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/staticfiles:ro
      - ./mediafiles:/app/mediafiles:ro
    depends_on:
      - django-web
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: contractlens-ollama
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama

  frontend:
    build:
      context: .
      dockerfile: Dockerfile-frontend

    container_name: contractlens-frontend
    working_dir: /app

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

    env_file:
      - .env.prod

    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"

    ports:
      - "3000:3000"

    depends_on:
      - django-web

volumes:
  postgres_data:
  ollama_data:
  frontend_node_modules:
  frontend_next: