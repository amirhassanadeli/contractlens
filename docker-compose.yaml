services:
  db:
    image: postgres:17
    container_name: contractlens-db
    restart: always
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  django-web:
    build: .
    container_name: django-docker
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./static:/app/staticfiles
      - ./media:/app/mediafiles
    env_file:
      - .env.prod
    expose:
      - "8000"

  frontend-proxy:
    image: nginx:latest
    container_name: contractlens-nginx
    ports:
      - "8001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/static:ro
      - ./media:/media:ro
    depends_on:
      - django-web
    restart: unless-stopped

volumes:
  postgres_data:
