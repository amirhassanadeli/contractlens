services:
  db:
    image: postgres:17
    container_name: contractlens-db
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shared-network

  django-web:
    build: .
    container_name: contractlens-django
    restart: unless-stopped
    env_file:
      - .env.prod
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./static:/app/staticfiles
      - ./mediafiles:/app/mediafiles
    networks:
      - shared-network

volumes:
  postgres_data:

networks:
  shared-network:
    external: true